name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0
                  run_install: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm run build

            - uses: CompeyDev/setup-rokit@v0.1.2

            - run: lune run scripts/lunit.luau

            # Studio plugin: its own tests under Lune, then the .rbxm.
            - run: pnpm install --frozen-lockfile
              working-directory: plugin
            - run: pnpm test
              working-directory: plugin
            - run: pnpm run build:plugin
              working-directory: plugin
            - uses: actions/upload-artifact@v4
              with:
                  name: Lunit-plugin
                  path: plugin/Lunit.rbxm

            # Game-type project (test/) built against the packed tarball.
            - run: pnpm run test:game

            # Lunit's own coverage, shown in the job summary.
            - run: pnpm run test:coverage
            - run: node action/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

    # The GitHub Action in action/, on a runner without Lune, against the
    # game-type project in test/.
    action:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0
                  run_install: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # Builds Lunit and installs the packed tarball into test/.
            - run: pnpm run install-test

            - uses: ./action
              with:
                  working-directory: test

            - uses: ./action
              id: lunit
              with:
                  working-directory: test
                  coverage: "true"

            # Coverage build checked against the markers in the source.
            - run: node check-coverage.js
              working-directory: test

            - name: Check outputs
              env:
                  COVERAGE: ${{ steps.lunit.outputs.coverage }}
                  LCOV: ${{ steps.lunit.outputs.lcov-path }}
              run: |
                  echo "coverage=$COVERAGE lcov-path=$LCOV"
                  test -n "$COVERAGE"
                  test -f "$LCOV"
